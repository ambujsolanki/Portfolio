<section class="skills">
  <h1>Technical Skills</h1>

  <div class="skill-section" *ngFor="let section of skillSections">
    <h2>{{ section.title }}</h2>

    <div class="skills-grid">
      <div class="skill-card" *ngFor="let skill of section.items">
        <img [src]="skill.icon" [alt]="skill.name" />
        <p>{{ skill.name }}</p>
      </div>
    </div>
  </div>
</section>
